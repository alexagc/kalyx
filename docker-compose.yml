version: '3.8'

services:
  # Quickstart standalone deployment with embedded SQLite
  kalyx:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/alexagc/kalyx:latest
    container_name: kalyx-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - KALYX_SEED_DEMO=true
      - KALYX_AUTH_DISABLED=true
    volumes:
      - kalyx-data:/data

