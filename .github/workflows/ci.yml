name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Run Go Tests
        run: go test -v -race ./...

      - name: Build Kalyx Binary
        run: |
          mkdir -p bin
          go build -v -o bin/kalyx ./cmd/kalyx
          go build -v -o bin/kalyxctl ./cmd/kalyxctl
