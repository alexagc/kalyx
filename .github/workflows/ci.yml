name: CI Pipeline & Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # 1. Code Quality & Security Linters Gate
  code-quality:
    name: Code Quality & Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Verify Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Error: The following files are not formatted according to gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Precompile Go packages
        run: go build ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m

      - name: Run govulncheck (Vulnerability Scanner)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "Vulnerability scan completed with advisories."

  # 2. Testing Pyramid & Race Detector Gate
  test-and-build:
    name: Tests Pyramid & Coverage
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Run Unit & Integration Tests (-race)
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./internal/... ./tests/integration/...

      - name: Run CLI E2E Tests
        run: go test -v ./tests/e2e/...

      - name: Verify Performance Benchmarks
        run: go test -v -bench=. -benchmem -run=^# ./internal/...

      - name: Build Standalone Binaries
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -v -ldflags="-s -w" -o bin/kalyx ./cmd/kalyx
          CGO_ENABLED=0 go build -v -ldflags="-s -w" -o bin/kalyxctl ./cmd/kalyxctl

      - name: Upload Code Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-report
          path: coverage.out
          retention-days: 14

  # 3. Frontend TypeScript Integrity Gate
  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck and Build Web Assets
        working-directory: web
        run: npm run build
