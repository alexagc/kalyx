# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: kalyx

before:
  hooks:
    - go mod tidy

builds:
  - id: kalyx
    main: ./cmd/kalyx
    binary: kalyx
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: kalyxctl
    main: ./cmd/kalyxctl
    binary: kalyxctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: kalyx-archive
    builds:
      - kalyx
    name_template: "kalyx_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*

  - id: kalyxctl-archive
    builds:
      - kalyxctl
    name_template: "kalyxctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
